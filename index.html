<!DOCTYPE html>
<html lang="or">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free Wi-Fi | Bapun Explores</title>

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);
  font-family:Arial, sans-serif;
  color:#fff;
}
.card{
  text-align:center;
  padding:28px 22px;
  border-radius:18px;
  background:rgba(0,0,0,0.55);
  box-shadow:0 0 30px rgba(0,0,0,0.6);
  max-width:380px;
  width:92%;
}
.dp{
  width:110px;
  height:110px;
  border-radius:50%;
  border:3px solid #00ffcc;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:36px;
  font-weight:bold;
  margin:0 auto 14px;
  background:#111;
}
h1{
  font-size:24px;
  margin:8px 0;
}
p{
  font-size:15px;
  opacity:.95;
  line-height:1.5;
}
.timer{
  margin-top:14px;
  font-size:20px;
  color:#00ffcc;
}
.counter{
  margin-top:10px;
  font-size:13px;
  opacity:.75;
}
.btn{
  display:inline-block;
  margin-top:16px;
  padding:12px 22px;
  border-radius:28px;
  background:linear-gradient(45deg,#ff3d81,#ff7a18);
  color:#fff;
  text-decoration:none;
  font-weight:bold;
}
.footer{
  margin-top:14px;
  font-size:12px;
  opacity:.65;
}
</style>

<script>
// VISITOR COUNTER (per device)
let visits = localStorage.getItem("bapun_visits");
visits = visits ? parseInt(visits)+1 : 1;
localStorage.setItem("bapun_visits", visits);

// COUNTDOWN
let count = 5;
function start(){
  document.getElementById("count").innerText = count;
  document.getElementById("visits").innerText = visits;
  const iv = setInterval(()=>{
    if(count>0){
      count--;
      document.getElementById("count").innerText = count;
    } else {
      clearInterval(iv);
    }
  },1000);
}

// REDIRECT
setTimeout(()=>{
  window.location.href="https://www.instagram.com/bapunexplores";
},3000);
</script>
</head>

<body onload="start()">
  <div class="card">
    <!-- DP fallback (always works) -->
    <div class="dp">BE</div>

    <h1>🔥 Free Wi-Fi Access</h1>
    <p>
      ଆଗକୁ ବଢ଼ିବା ପାଇଁ<br>
      Instagram ରେ <b>@bapunexplores</b> କୁ follow କରନ୍ତୁ 💙
    </p>

    <div class="timer">
      Redirecting in <span id="count">3</span> sec…
    </div>

    <a class="btn" href="https://www.instagram.com/bapunexplores">
      Follow on Instagram
    </a>

    <div class="counter">
      👥 Visitors: <span id="visits">0</span>
    </div>

    <div class="footer">
      Travel • Explore • Odisha
    </div>
  </div>
</body>
</html>
